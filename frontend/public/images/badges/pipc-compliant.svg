<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Korean PIPC Compliance Badge -->
  <defs>
    <linearGradient id="pipc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="url(#pipc-gradient)" filter="url(#shadow)"/>

  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Lock icon (privacy symbol) -->
  <rect x="80" y="85" width="40" height="45" rx="5" fill="#ffffff" opacity="0.95"/>
  <path d="M 85 85 V 75 Q 85 60 100 60 Q 115 60 115 75 V 85"
        fill="none" stroke="#ffffff" stroke-width="6" opacity="0.95"/>

  <!-- Keyhole -->
  <circle cx="100" cy="105" r="6" fill="#2E7D32"/>
  <rect x="97" y="105" width="6" height="12" fill="#2E7D32"/>

  <!-- Korean text PIPC -->
  <text x="100" y="160" font-family="'Noto Sans KR', sans-serif" font-size="14"
        font-weight="700" fill="#ffffff" text-anchor="middle">개인정보보호</text>

  <!-- English text -->
  <text x="100" y="177" font-family="Arial, sans-serif" font-size="10"
        font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.9">PIPC Compliant</text>
</svg>
