name: Deploy Korean AI Compliance Guardian

on:
  push:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run backend tests
        run: pytest

  test-frontend:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

  deploy-backend:
    runs-on: ubuntu-latest
    needs:
      - test-frontend
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        run: |
          echo "Backend deployment is managed by Render's auto-deploy from main branch"
          echo "Configure auto-deploy at https://dashboard.render.com"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs:
      - deploy-backend
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PRICE_ID: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID }}
        run: |
          npm install -g vercel
          vercel deploy --prebuilt --token $VERCEL_TOKEN --prod
